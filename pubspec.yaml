name: hd_background_wallpaper
description: "4K & HD Background Wallpaper Studio with 266 offline wallpapers, Cloud 4K feed, Custom Collections, and Live Lock/Home Mockup Preview."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
