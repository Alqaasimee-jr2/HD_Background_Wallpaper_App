name: hd_background_wallpaper
description: "4K & HD Background Wallpaper Studio with 900 curated offline wallpapers across 9 categories, Cloud 4K feed, Custom Collections, and Live Lock/Home Mockup Preview."
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
    - assets/icon/app_icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
